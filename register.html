<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="style4.css">
</head>
<body>
    
    
    
    <a class="menu"   href="index.html">  <button class="btn">MENU</button> </a>



    
    
    <div class="window">




    <span class="seredina">
    <form class="form" id="loginForm" novalidate>
  <p class="form-title">Account</p>
  <p class="auth-status" id="authStatus"></p>

  <div class="input-container">
    <input id="username" name="username" type="text" placeholder="Enter username" required>
    <small class="error" data-for="username"></small>
  </div>

  <div class="input-container">
    <input id="email" name="email" type="email" placeholder="Enter email for registration">
    <small class="error" data-for="email"></small>
  </div>

  <div class="input-container">
    <input id="password" name="password" type="password" placeholder="Enter password" required>
    <small class="error" data-for="password"></small>
  </div>

  <button type="submit" class="submit" id="loginSubmit">
    Sign in
  </button>

  <button type="button" class="submit secondary" id="registerSubmit">
    Create account
  </button>

  <button type="button" class="submit danger" id="logoutSubmit">
    Logout
  </button>

</form>
</span>

</div>
<script src="script.js" defer></script>
</body>
</html>
