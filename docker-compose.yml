services:
  postgres:
    image: postgres:16
    container_name: ingredients_store_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ingredients_store
      POSTGRES_USER: ingredients_user
      POSTGRES_PASSWORD: ingredients_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
